<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Scene 1: The Vault -->
    <div id="scene-login" class="scene">
        <p class="hint-text">Enter the password to continue</p>
        <input type="password" id="password-input" placeholder="Password..." />
        <button id="login-btn">Done</button>
        <p id="error-msg" class="hidden error">Incorrect. Try again!</p>
    </div>

    <!-- Scene 1.5: The Loading Screen -->
    <div id="scene-loading" class="scene hidden">
        <h1 id="loading-text">Loading</h1>
    </div>

    <!-- Scene 2 & 3: The Photo, Cake, and Wish -->
    <div id="scene-cake" class="scene hidden">
        <div class="photo-container">
            <!-- Replace the src with the actual filename of her photo -->
            <img src="https://via.placeholder.com/150?text=Her+Photo" alt="Birthday Girl" class="pop-in-photo" id="her-photo">
        </div>
        
        <div class="cake-container" id="cake-container">
            <div class="flame" id="flame">🔥</div>
            <div class="candle">🕯️</div>
            <div class="cake">🎂</div>
            <div class="table">🪑</div>
        </div>
        
        <p class="blow-text" id="blow-text">Blow me (tap the flame) 💨</p>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
