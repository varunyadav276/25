<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="overlay-decorations" class="hidden">
        <img src="cat.png" id="peeking-cat" alt="Cat">
        <img src="your-gif.gif" id="top-right-gif" alt="Funny GIF">
    </div>

    <!-- Scene 1: The Vault -->
    <div id="scene-login" class="scene">
        <p class="hint-text">Enter the password to continue</p>
        <input type="password" id="password-input" placeholder="Password..." />
        <button id="login-btn">Done</button>
        <p id="error-msg" class="hidden error">Incorrect. Try again!</p>
    </div>

    <!-- Scene 1.5: The Loading Screen -->
    <div id="scene-loading" class="scene hidden">
        <h1 id="loading-text">Loading</h1>
    </div>

    <!-- Scene 2 & 3: The Photo, Cake, and Wish -->
    <div id="scene-cake" class="scene hidden">
        <div class="photo-container">
            <!-- Replace the src with the actual filename of her photo -->
            <img src="vasma.jpg" alt="Birthday Girl" class="pop-in-photo" id="her-photo">
        </div>
        
        <div class="cake-container" id="cake-container">
            <!-- Replace emojis with image tags -->
            <img src="flame.png" alt="flame" class="flame" id="flame">
            <img src="candle.png" alt="candle" class="candle">
            <img src="cake.png" alt="cake" class="cake">
            <img src="table.png" alt="table" class="table">
        </div>
        
        <p class="blow-text" id="blow-text">Blow me (tap the flame) 💨</p>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
